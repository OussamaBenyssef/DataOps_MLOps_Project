name: CI — DataOps/MLOps Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  PYTHON_VERSION: "3.11"

jobs:
  # ══════════════════════════════════════════════════
  # JOB 1 : LINT (flake8 + black)
  # ══════════════════════════════════════════════════
  lint:
    name: 🔍 Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-lint-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-lint-

      - name: Install lint dependencies
        run: pip install flake8 black

      - name: Run flake8 (src/ + dags/)
        run: |
          flake8 src/ dags/ \
            --max-line-length=120 \
            --extend-ignore=E203,W503,E501 \
            --exclude=src/ml/api/,__pycache__,.venv \
            --statistics

      - name: Run black check (src/ + dags/)
        run: |
          black --check --line-length=120 \
            src/ dags/ \
            --exclude='/(\.venv|__pycache__|\.git)/'

  # ══════════════════════════════════════════════════
  # JOB 2 : UNIT TESTS (pytest sans services externes)
  # ══════════════════════════════════════════════════
  unit-tests:
    name: 🧪 Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-test-${{ hashFiles('requirements-ci.txt') }}
          restore-keys: ${{ runner.os }}-pip-test-

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements-ci.txt

      - name: Run unit tests (excluding integration)
        run: |
          pytest tests/ \
            -m "not integration and not integration_pipeline" \
            --ignore=tests/test_aggregated_metrics.py \
            --ignore=tests/test_spark_processing.py \
            --ignore=tests/test_integration_kafka_spark_mongodb.py \
            --ignore=tests/test_real_data_e2e.py \
            -v \
            --tb=short \
            --no-header \
            -x \
            2>&1

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results
          path: .pytest_cache/

  # ══════════════════════════════════════════════════
  # JOB 3 : DAG VALIDATION
  # ══════════════════════════════════════════════════
  dag-validation:
    name: ✈️ DAG Validation
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-dags-${{ hashFiles('requirements-ci.txt') }}
          restore-keys: ${{ runner.os }}-pip-dags-

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements-ci.txt

      - name: Validate all DAGs load correctly
        run: |
          pytest tests/test_dags.py \
            -v \
            --tb=short \
            --no-header \
            2>&1

      - name: Check DAG count
        run: |
          echo "📋 DAGs présents dans dags/:"
          ls -la dags/*.py | grep -v __pycache__
          echo "Total: $(ls dags/*.py 2>/dev/null | wc -l) DAG(s)"

  # ══════════════════════════════════════════════════
  # JOB 4 : DOCKER BUILD
  # ══════════════════════════════════════════════════
  docker-build:
    name: 🐳 Docker Build
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        include:
          - name: binance-streaming
            dockerfile: docker/Dockerfile.streaming
          - name: spark
            dockerfile: docker/Dockerfile.spark
          - name: ml-trainer
            dockerfile: docker/Dockerfile.ml
          - name: fastapi
            dockerfile: docker/Dockerfile.api
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image — ${{ matrix.name }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          tags: datamlops/${{ matrix.name }}:ci-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  # ══════════════════════════════════════════════════
  # JOB 5 : SECURITY SCAN
  # ══════════════════════════════════════════════════
  security-scan:
    name: 🔒 Security Scan
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install security tools
        run: pip install bandit safety

      - name: Run bandit (code security analysis)
        run: |
          bandit -r src/ \
            -ll \
            --exclude src/ml/api/ \
            -f json \
            -o bandit-report.json || true
          bandit -r src/ \
            -ll \
            --exclude src/ml/api/ \
            --format txt || true

      - name: Run safety check (dependency vulnerabilities)
        run: |
          safety check \
            -r requirements.txt \
            --full-report || true

      - name: Upload bandit report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bandit-security-report
          path: bandit-report.json

  # ══════════════════════════════════════════════════
  # RÉSUMÉ FINAL
  # ══════════════════════════════════════════════════
  ci-summary:
    name: ✅ CI Summary
    runs-on: ubuntu-latest
    needs: [unit-tests, dag-validation, docker-build, security-scan]
    if: always()
    steps:
      - name: Check all jobs status
        run: |
          echo "══════════════════════════════════════"
          echo "  CI DataOps/MLOps — Résumé"
          echo "══════════════════════════════════════"
          echo "  Unit Tests       : ${{ needs.unit-tests.result }}"
          echo "  DAG Validation   : ${{ needs.dag-validation.result }}"
          echo "  Docker Build     : ${{ needs.docker-build.result }}"
          echo "  Security Scan    : ${{ needs.security-scan.result }}"
          echo "══════════════════════════════════════"
          if [ "${{ needs.unit-tests.result }}" != "success" ] || \
             [ "${{ needs.dag-validation.result }}" != "success" ] || \
             [ "${{ needs.docker-build.result }}" != "success" ]; then
            echo "❌ Pipeline CI FAILED"
            exit 1
          fi
          echo "✅ Pipeline CI PASSED"
