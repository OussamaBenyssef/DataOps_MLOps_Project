source:
  type: kafka
  config:
    connection:
      bootstrap: "kafka:9092"
    # Pas de schema_registry_url : on ingère uniquement les métadonnées des topics
    # (pas de ConfluentSchemaRegistry = pas de dépendance grpc requise)
    ignore_warnings_on_schema_type: true

sink:
  type: datahub-rest
  config:
    server: "http://datahub-gms:8080"