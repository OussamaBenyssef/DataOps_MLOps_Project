source:
  type: mongodb
  config:
    connect_uri: "mongodb://datamlops:datamlops123@mongodb:27017/cryptomarket?authSource=admin"
    username: "datamlops"
    password: "datamlops123"
    database_pattern:
      allow:
        - "cryptomarket"
     # Filtre des collections pour ingérer uniquement les objets utiles.
    collection_pattern:
      # Autorise uniquement les collections produites/consommées par les pipelines.
      allow:
        - "raw_trades"
        - "ohlcv"
        - "indicators"
        - "aggregated_metrics"
        - "anomalies"
        
    # Active le profiling pour publier des stats de colonnes dans DataHub.
    profiling:
      enabled: true

    # Active la suppression des métadonnées obsolètes côté catalogue.
    stateful_ingestion:
      enabled: true
      remove_stale_metadata: true

sink:
  type: datahub-rest
  config:
    server: "http://datahub-gms:8080"